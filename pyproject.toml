[project]
name = "identity-panel"
version = "0.1.0"
description = "Base pipeline for studying how multi-agent deliberation changes identity bias in LLM judges"
requires-python = ">=3.9"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["identity_panel"]
